name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"

      - name: Run tests
        env:
          HOME: ${{ runner.temp }}/agent-reach-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/agent-reach-home/.config
        run: python -m pytest -q --cov=agent_reach --cov-report=term-missing

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e ".[dev]"
      - name: Ruff
        run: |
          python -m ruff check agent_reach tests scripts
          python -m ruff format --check agent_reach tests scripts
      - name: Mypy
        run: python -m mypy agent_reach
      - name: Shellcheck
        run: shellcheck test.sh agent_reach/scripts/transcribe_xiaoyuzhou.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Audit Python constraints and emit SBOM
        run: |
          python -m pip install "pip-audit==2.9.0"
          python -m pip_audit -r constraints.txt --progress-spinner off
          python -m pip_audit -r constraints.txt --format cyclonedx-json --output sbom.cdx.json
      - name: Preserve CycloneDX SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-reach-sbom
          path: sbom.cdx.json
          if-no-files-found: error
      - name: Scan for committed credential patterns
        run: python scripts/scan-secrets.py

  wheel-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip "build==1.3.0"
          python -m build
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import collections
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          duplicates = [name for name, count in collections.Counter(names).items() if count > 1]
          assert not duplicates, f"duplicate entries in wheel: {duplicates}"
          assert "agent_reach/skill/SKILL.md" in names
          for prefix in ("agent_reach/guides/", "agent_reach/scripts/", "agent_reach/skill/references/"):
              assert any(name.startswith(prefix) for name in names), f"{prefix} missing"
          PY
      - name: Smoke-install wheel
        run: |
          python -m venv "${RUNNER_TEMP}/smoke"
          "${RUNNER_TEMP}/smoke/bin/pip" install --quiet dist/*.whl
          "${RUNNER_TEMP}/smoke/bin/agent-reach" version
          SMOKE_ROOT="${RUNNER_TEMP}/smoke" python - <<'PY'
          import os
          import pathlib
          import subprocess

          executable = pathlib.Path(os.environ["SMOKE_ROOT"]) / "bin" / "agent-reach-mcp"
          result = subprocess.run([executable], capture_output=True, text=True, timeout=10)
          assert result.returncode == 1, result
          assert "MCP not installed" in result.stderr, result.stderr
          PY
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/smoke/bin/python" -c "from importlib.resources import files; assert (files('agent_reach')/'skill'/'SKILL.md').is_file()"
