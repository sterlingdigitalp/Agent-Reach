[project]
name = "agent-reach"
dynamic = ["version"]
description = "A consent-first capability layer for read-only access across 13 internet channels."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Neo Reid"}]
keywords = [
    "ai-agent", "llm-tools", "agent-infrastructure", "mcp",
    "web-reader", "web-scraper", "search",
    "twitter-scraper", "reddit-scraper", "youtube-transcript",
    "bilibili", "xiaohongshu",
    "ai-search", "cli", "automation",
    "claude-code", "cursor", "openai",
    "free-api", "no-api-key",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "requests>=2.33.0",
    "feedparser>=6.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "rich>=13.0",
    "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
browser = ["browser-cookie3>=0.19"]
cookies = ["browser-cookie3>=0.19"]
all = ["mcp[cli]>=1.0", "browser-cookie3>=0.19"]
mcp = ["mcp[cli]>=1.0"]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "ruff>=0.15.1",
    "mypy>=1.19.1",
    "pip-audit>=2.9",
    "types-requests>=2.32",
    "types-PyYAML>=6.0",
]

[project.scripts]
agent-reach = "agent_reach.cli:main"
agent-reach-mcp = "agent_reach.integrations.mcp_server:cli_main"

[project.urls]
Homepage = "https://github.com/Panniantong/agent-reach"
Repository = "https://github.com/Panniantong/agent-reach"
Issues = "https://github.com/Panniantong/agent-reach/issues"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "agent_reach/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["agent_reach"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/"]

[tool.coverage.run]
branch = true
source = ["agent_reach"]

[tool.coverage.report]
fail_under = 50
show_missing = true
